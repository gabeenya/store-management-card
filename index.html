<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가맹점 운영 리스크 스카우팅 카드</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="shell">
  <aside class="roster">
    <div class="roster-head">
      <div class="eyebrow">외식BG · RO실</div>
      <h1 onclick="goDashboard()" style="cursor:pointer;" title="전체 현황으로 이동">가맹점 운영 리스크 카드</h1>
      <div class="roster-count" id="rosterCount" style="font-size:11px; color:var(--text-3); margin-bottom:4px;"></div>
      <div id="dbStatus" style="font-size:10.5px; margin-bottom:8px; display:flex; align-items:center; gap:5px;"></div>
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9aa7ba" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" placeholder="매장명 또는 코드 검색">
      </div>
    </div>
    <div class="brand-filter" id="brandFilter"></div>
    <div class="roster-list" id="rosterList"></div>
  </aside>

  <main class="main" id="main"></main>
</div>

<script src="data/seed-stores.js"></script>
<script src="app.js"></script>
</body>
</html>
