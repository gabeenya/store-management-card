<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가맹점 운영 리스크 카드</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<script>
(function(){
  var saved = localStorage.getItem('theme');
  var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
</head>
<body>
<div id="lockScreen" class="lock-screen">
  <div class="lock-card">
    <img src="assets/img/elandeats-fulllogo.png" alt="이랜드이츠" class="lock-logo">
    <div class="lock-title">가맹점 운영 리스크 카드</div>
    <div class="lock-sub">로그인 후 이용할 수 있습니다</div>
    <form id="lockForm" autocomplete="off">
      <input id="lockEmail" class="lock-input lock-input-text" type="email" autocomplete="username" placeholder="이메일" required>
      <input id="lockPassword" class="lock-input lock-input-text" type="password" autocomplete="current-password" placeholder="비밀번호" required>
      <button type="submit" class="lock-btn">로그인</button>
    </form>
    <div id="lockError" class="lock-error"></div>
  </div>
</div>
<button id="logoutBtn" class="theme-toggle theme-toggle-2" onclick="logout()" title="로그아웃" hidden>🔓</button>
<button id="themeToggle" class="theme-toggle" onclick="toggleTheme()" title="다크/라이트 모드 전환">🌙</button>
<div class="shell">
  <aside class="roster">
    <div class="roster-head">
      <div class="brand-logo-row">
        <div class="brand-logo-wrap" onclick="goDashboard()" title="전체 현황으로 이동">
          <img src="assets/img/elandeats-fulllogo.png" alt="이랜드이츠" class="brand-logo-img">
        </div>
      </div>
      <div class="eyebrow">외식BG · RO실</div>
      <h1 onclick="goDashboard()" style="cursor:pointer;" title="전체 현황으로 이동">가맹점 운영 리스크 카드</h1>
      <div class="roster-count" id="rosterCount" style="font-size:11px; color:var(--text-3); margin-bottom:4px;"></div>
      <div id="dbStatus" style="font-size:10.5px; margin-bottom:8px; display:flex; align-items:center; gap:5px;"></div>
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9aa7ba" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" placeholder="매장명 또는 코드 검색">
      </div>
      <button class="upload-nav-btn" onclick="goUpload()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        엑셀 데이터 업로드
      </button>
      <button class="upload-nav-btn" onclick="goSettings()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        리스크 기준 설정
      </button>
    </div>
    <div class="brand-filter" id="brandFilter"></div>
    <div class="roster-list" id="rosterList"></div>
  </aside>

  <main class="main" id="main"></main>
</div>

<script src="data/seed-stores.js"></script>
<script src="app.js"></script>
</body>
</html>
